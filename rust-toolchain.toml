[toolchain]
# Track stable, matching topcoat; the MSRV floor stays in `Cargo.toml` (GH #175).
channel = "stable"
# Explicit so CI images without the default profile have the fmt/clippy tools.
components = ["rustfmt", "clippy"]
# The `fmt` job uses `nightly-2026-08-24`: rustfmt.toml keys are nightly-only (GH #269).
