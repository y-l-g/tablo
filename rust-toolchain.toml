[toolchain]
# Track stable, matching topcoat; the MSRV floor stays in `Cargo.toml`.
channel = "stable"
# Explicit so CI images without the default profile have the fmt/clippy tools.
components = ["rustfmt", "clippy"]
# The `fmt` job uses the dated nightly `xtask/src/gates.rs` names: rustfmt.toml keys are
# nightly-only.
