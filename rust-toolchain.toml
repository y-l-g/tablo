[toolchain]
# Track stable, matching topcoat; the MSRV floor stays in `Cargo.toml`.
channel = "stable"
# Explicit so CI images without the default profile have the fmt/clippy tools.
components = ["rustfmt", "clippy"]
# The `fmt` and `public-api` jobs use the dated nightly `xtask/src/gates.rs` names: rustfmt.toml
# keys and rustdoc JSON are nightly-only.
