max_width = 100
reorder_imports = true
comment_width = 100
wrap_comments = true
format_code_in_doc_comments = true
doc_comment_code_block_width = 100
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# `primitives/` mirrors the registry verbatim and `primitives.rs` is generated beside it;
# reformatting either breaks `verify-topcoat-ui`.
ignore = [
    "crates/tablo-ui/src/components/primitives",
    "crates/tablo-ui/src/components/primitives.rs",
]
