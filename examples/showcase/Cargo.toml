[package]
name = "showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Showcase: real-world Panel demo (Users, Authors, Posts) exercising every Tablo feature through real resources."

# One test binary: autodiscovery would link every file under `tests/` separately.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# The facade, as an app names it: the toolkit at its root, the components as `tablo::ui`.
tablo = { path = "../../crates/tablo" }
jiff.workspace = true
toasty = { workspace = true, features = ["sqlite"] }
# `fs` is for the demo uploader's `tokio::fs` write; `multipart` is the extractor the media
# library's page parses its own upload body with.
tokio = { workspace = true, features = ["fs"] }
topcoat = { workspace = true, features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart", "mail"] }
uuid.workspace = true

# The integration suite's other drivers: `TABLO_TEST_DATABASE_URL` names the database.
[features]
postgresql = ["tablo/postgresql"]
mysql = ["tablo/mysql"]
turso = ["tablo/turso"]

[build-dependencies]
tablo-build = { path = "../../crates/tablo-build" }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tablo = { path = "../../crates/tablo", features = ["testing"] }

[lints]
workspace = true
