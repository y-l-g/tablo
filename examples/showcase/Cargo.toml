[package]
name = "showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Showcase: real-world Panel demo (Users, Authors, Posts) exercising every Tablo feature through real resources."

# One test binary (GH #179): autodiscovery would link every file under `tests/` separately.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
# The facade, as an app names it: the toolkit at its root, the components as `tablo::ui`.
tablo = { path = "../../crates/tablo" }
jiff.workspace = true
toasty = { workspace = true, features = ["sqlite"] }
# `fs` is for the demo uploader's `tokio::fs` write (GH #188); `multipart` is
# the extractor the media library's page parses its own upload body with
# (GH #248).
tokio = { workspace = true, features = ["fs"] }
topcoat = { workspace = true, features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart"] }
uuid.workspace = true

[build-dependencies]
tablo-build = { path = "../../crates/tablo-build" }

[dev-dependencies]
form_urlencoded = "1.2"
http = "1"
http-body-util = "0.1"
tablo = { path = "../../crates/tablo", features = ["testing"] }

[lints]
workspace = true
