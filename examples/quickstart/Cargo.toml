[package]
name = "quickstart"
version = "0.1.0"
edition = "2024"
publish = false
description = "The smallest complete Tablo app, built as a dependent outside the workspace would build it."

# Detached from the Tablo workspace on purpose: the app depends on Tablo the way
# an app in its own repository does, through the `tablo` facade, and links the
# stylesheet `tablo-ui` ships, so it has no build script. `cargo xtask
# external-check` copies it out of the repository, rewrites its `path`
# dependencies to absolute ones, and runs its tests there, so a path that only
# resolves inside this repository fails the check.
[workspace]

[dependencies]
tablo = { path = "../../crates/tablo", features = ["sqlite"] }
# ANCHOR: upstream
topcoat = { version = "0.11", default-features = false, features = ["view", "router", "discover", "serve", "font", "font-fontsource", "asset"] }
toasty = { version = "0.11", default-features = false, features = ["jiff"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
# ANCHOR_END: upstream

[dev-dependencies]
tablo = { path = "../../crates/tablo", features = ["sqlite", "testing"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

# Temporary: the same Topcoat `main` patch as the workspace; drop it with the workspace one.
[patch.crates-io]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "6d95e1eeabecd5c82eb459ce96d5e55ad5d5b8a7" }
