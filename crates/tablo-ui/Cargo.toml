[package]
name = "tablo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beautiful Topcoat UI primitives for Tablo — owned library over topcoat-ui-registry."
# Metadata only, no native library: `build.rs` publishes the source directory an
# app's Tailwind build scans (`DEP_TABLO_UI_SRC`).
links = "tablo-ui"

[dependencies]
http = "1"
topcoat = { workspace = true, features = ["font", "font-fontsource", "asset", "icon", "icon-iconify", "runtime"] }

[dev-dependencies]
tokio = { workspace = true }

[build-dependencies]
topcoat = { workspace = true, features = ["icon-iconify"] }

[lints]
workspace = true
