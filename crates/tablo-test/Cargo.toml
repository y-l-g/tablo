[package]
name = "tablo-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-memory HTTP test client for Tablo panels, re-exported as `tablo::testing`."

[dependencies]
tablo-core = { path = "../tablo-core", version = "0.10.0", default-features = false }
# The authenticator code a test signs in with, computed apart from the panel's own check.
data-encoding = "2"
form_urlencoded = "1.2"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
jiff.workspace = true
percent-encoding.workspace = true
serde_json = "1"
sha1 = "0.11"
# The PKCE challenge `FakeProvider` checks a token request's verifier against.
sha2.workspace = true
# `FakeProvider` serves its endpoints on a loopback port.
tokio = { workspace = true, features = ["net", "io-util"] }
# `migrated_db` applies the app's embedded migrations.
toasty = { workspace = true, features = ["migration"] }
topcoat = { workspace = true }
uuid.workspace = true

[lints]
workspace = true
