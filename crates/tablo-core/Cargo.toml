[package]
name = "tablo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core toolkit types for Tablo, a server-rendered admin toolkit on Topcoat and Toasty."
# Metadata only, no native library: `build.rs` publishes the source directory an
# app's Tailwind build scans (`DEP_TABLO_CORE_SRC`).
links = "tablo-core"

# GH #179, see `docs/dev/TESTING.md`: one integration-test binary per crate. Cargo
# autodiscovers
# every file under `tests/` as its own target, which is exactly the per-file
# link cost this consolidation removes — so the module files are declared as one
# target and autodiscovery stays off.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
tablo-macros = { path = "../tablo-macros" }
tablo-ui = { path = "../tablo-ui" }
argon2 = "0.6"
bytes = "1"
# The email rule (GH #243). `default-features = false` matches how `lettre`
# already pulls the crate in through `topcoat-mail`: the serde support is unused
# here, and the lock keeps the entry it has.
email_address = { version = "0.2", default-features = false }
form_urlencoded = "1.2"
heck = "0.5"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
jiff.workspace = true
password-hash = { version = "0.6", features = ["getrandom"] }
percent-encoding.workspace = true
subtle = "2"
serde.workspace = true
tokio.workspace = true
toasty.workspace = true
toasty-core.workspace = true
# `fs` is for `Panel::serve_dir` (GH #188): serving an upload directory is a
# panel-level route, and upstream the directory route lives behind that feature.
topcoat = { workspace = true, features = ["view", "router", "discover", "asset", "font", "runtime", "cookie", "multipart", "icon", "fs", "session"] }
tracing = "0.1"
uuid.workspace = true
# The shard layer reads the panel a live table re-renders for from the shard
# request's JSON arguments.
serde_json = "1"

[dev-dependencies]
tablo-test = { path = "../tablo-test" }
tokio.workspace = true
# The suites run on in-memory SQLite. The library enables no driver: the app
# picks one on its own `toasty` dependency.
toasty = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
