[package]
name = "tablo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The core toolkit types for Tablo, a server-rendered admin toolkit on Topcoat and Toasty."
# Metadata only, no native library: `build.rs` publishes the source directory an
# app's Tailwind build scans (`DEP_TABLO_CORE_SRC`).
links = "tablo-core"

[features]
default = ["password", "mail"]
# The shipped `AdminUser` and `PasswordAuth`, and Argon2id hashing (`hash_password`,
# `verify_password`). An app that signs users in through its own `Authenticator` without
# storing passwords turns it off; a panel then names its auth with `Panel::auth`.
password = ["dep:argon2", "dep:password-hash"]
# `Auth::password_reset`, which mails reset links through Topcoat's mailer.
mail = ["topcoat/mail"]

[dependencies]
tablo-macros = { path = "../tablo-macros", version = "0.7.0" }
tablo-ui = { path = "../tablo-ui", version = "0.7.0" }
argon2 = { version = "0.6", optional = true }
bytes = "1"
# `Clone` and `Debug` impls without `derive`'s bound on the model type.
derive-where = "1.7"
# The email rule. `default-features = false` matches how `lettre`
# already pulls the crate in through `topcoat-mail`: the serde support is unused
# here, and the lock keeps the entry it has.
email_address = { version = "0.2", default-features = false }
form_urlencoded = "1.2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
heck = "0.5"
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
jiff.workspace = true
password-hash = { version = "0.6", features = ["getrandom"], optional = true }
percent-encoding.workspace = true
# The default plural of a resource's label and slug; Toasty pluralizes its table names with it.
pluralizer = "0.5"
# A text field's `pattern` rule, checked again on the server.
regex = "1"
subtle = "2"
serde.workspace = true
# `sync` bounds how many Argon2 runs the blocking pool holds at once.
tokio = { workspace = true, features = ["sync"] }
toasty.workspace = true
toasty-core.workspace = true
# `fs` is for `Panel::serve_dir`: serving an upload directory is a
# panel-level route, and upstream the directory route lives behind that feature.
topcoat = { workspace = true, features = ["view", "router", "discover", "asset", "font", "runtime", "cookie", "multipart", "icon", "fs", "session"] }
tracing = "0.1"
uuid.workspace = true

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1"
trybuild = "1.0"
tokio.workspace = true
# The suites run on in-memory SQLite. The library enables no driver: the app
# picks one on its own `toasty` dependency.
toasty = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
