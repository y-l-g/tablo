[package]
name = "storefront-tablo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# A workspace member so it builds against the workspace's lockfile, but never released:
# release-plz only releases the crates `release-plz.toml` opts in.
[dependencies]
tablo-core = { path = "../../crates/tablo-core" }
# `postgresql` is enabled here only (GH #171): the workspace's suites run on sqlite alone, while
# the bench also measures the Postgres list path.
topcoat = { workspace = true, features = ["serve", "runtime", "asset"] }
toasty = { workspace = true, features = ["sqlite", "postgresql"] }
http = "1"
jiff.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio.workspace = true

[lints]
workspace = true
