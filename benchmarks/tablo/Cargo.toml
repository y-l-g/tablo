[package]
name = "tablo-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# A workspace member so it builds against the workspace's lockfile, but never released:
# release-plz only releases the crates `release-plz.toml` opts in.
[dependencies]
tablo-core = { path = "../../crates/tablo-core" }
topcoat = { workspace = true, features = ["serve", "runtime", "asset"] }
toasty = { workspace = true, features = ["sqlite"] }
http = "1"
jiff.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio.workspace = true

# The Postgres leg. Off by default: the workspace's builds would otherwise compile the Postgres
# driver for the bench alone.
[features]
postgresql = ["toasty/postgresql"]

[lints]
workspace = true
