[package]
name = "storefront-tablo"
version = "0.1.0"
edition = "2024"
publish = false

# Detached from the Tablo workspace on purpose: the bench app links the
# toolkit plus a full topcoat runtime, so it is a standalone crate with its
# own dependency tree (mirrors topcoat/benchmarks).
#
# Upstream versions track the workspace's per CONTRIBUTING.md "Dependency pins":
# bump all three manifests and both lockfiles in one commit.
[workspace]

[dependencies]
tablo-core = { path = "../../crates/tablo-core" }
# `default-features = false` mirrors the workspace baseline (GH #175): without
# it the bench builds upstream defaults (e.g. toasty's `rustls`) the shipped
# toolkit never compiles against.
# Feature-flag delta vs the workspace (GH #171, documented): `postgresql` is
# enabled here only — the workspace's suites run on sqlite alone, while the
# honest bench must also measure the Postgres list path. Versions track the workspace;
# only features differ.
topcoat = { version = "0.10", default-features = false, features = ["router", "serve", "runtime", "discover", "asset"] }
toasty = { version = "0.11", default-features = false, features = ["sqlite", "postgresql", "jiff"] }
http = "1"
jiff = "0.2"
uuid = { version = "1.23", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "deny"
