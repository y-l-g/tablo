[alias]
xtask = "run --package xtask --"

# codegen-units stays explicit so a machine-wide cargo config cannot scale it down.
#
# debug = 1 is line tables only: enough for backtraces and breakpoints.
[profile.dev]
codegen-units = 16
debug = 1

# Dependencies build once and run in every test: unoptimized, Argon2 hashing and proptest's
# generators take most of the suite's time. The test profile inherits this; workspace crates stay
# unoptimized.
[profile.dev.package."*"]
opt-level = 1

[profile.test]
codegen-units = 16
debug = 1
