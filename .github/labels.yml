# Source of truth synced by `.github/workflows/labels.yml`, which deletes any label missing here;
# update this file, not the GitHub UI.

# Applied by an issue template.
- name: bug
  description: "Something is not working."
  color: "d73a4a"
- name: enhancement
  description: "A new feature or a change to the public API."
  color: "a2eeef"
- name: upstream
  description: "Missing or unstable upstream Toasty or Topcoat API."
  color: "1d76db"

# Triage roles. One at a time; a maintainer sets and replaces them.
- name: needs-triage
  description: "Maintainer needs to evaluate this issue."
  color: "fbca04"
- name: ready-for-agent
  description: "Fully specified, ready for an AFK agent."
  color: "0e8a16"
- name: deferred
  description: "Real, but not scheduled now."
  color: "bfdadc"

# Applied by release-plz (`pr_labels`); the release job publishes only a merged PR carrying it.
- name: release
  description: "A release-plz release PR; merging it publishes the crates."
  color: "5319e7"

# Applied by a maintainer.
- name: documentation
  description: "Improvements or additions to documentation."
  color: "0075ca"
- name: duplicate
  description: "This issue or pull request already exists."
  color: "cfd3d7"
- name: wontfix
  description: "This will not be worked on."
  color: "ffffff"
