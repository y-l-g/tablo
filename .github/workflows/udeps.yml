name: udeps

# cargo-udeps needs nightly, so it runs apart from the per-PR jobs. On master, ci.yml calls this
# workflow so the release job waits for it.
on:
  workflow_call:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - .github/workflows/udeps.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: udeps-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0

jobs:
  udeps:
    name: udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --locked
