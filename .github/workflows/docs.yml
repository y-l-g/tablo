name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys through a Pages artifact, so no branch accumulates a copy of the site per push.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'y-l-g/tablo'
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2@0.13.0

      - name: Build guide
        run: mdbook build docs/guide

      # Not `-D warnings`: the API reference publishes whatever builds.
      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps

      # The landing page and the examples gallery at the root, from `site/`; the docs under
      # `nightly/`. `site/scripts/` and the README stay in the repository.
      - name: Assemble site directory
        run: |
          mkdir -p _site/nightly/guide _site/nightly/api _site/nightly/atlas
          cp -r site/index.html site/examples site/assets _site/
          cp -r docs/guide/book/html/. _site/nightly/guide/
          cp -r target/doc/. _site/nightly/api/
          cp -r docs/atlas/. _site/nightly/atlas/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
