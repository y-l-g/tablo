name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys through a Pages artifact, so no branch accumulates a copy of the site per push.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'y-l-g/tablo'
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}nightly/guide/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2@0.13.0

      - name: Build guide
        run: mdbook build docs/guide

      # Not `-D warnings`: the API reference publishes whatever builds.
      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps

      - name: Assemble site directory
        run: |
          mkdir -p site/nightly/guide site/nightly/api site/nightly/atlas
          cp -r docs/guide/book/html/. site/nightly/guide/
          cp -r target/doc/. site/nightly/api/
          cp -r docs/atlas/. site/nightly/atlas/
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
            <head><meta http-equiv="refresh" content="0; url=nightly/guide/"></head>
            <body><a href="nightly/guide/">Redirect to the Tablo Guide</a></body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
