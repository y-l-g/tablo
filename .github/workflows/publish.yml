name: publish

# First release and every bump after: the family publishes in dependency
# order, each step waiting for the previous crate to land on the registry.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Short-lived token via OIDC; each crate needs its pending trusted
      # publisher on crates.io before the first run.
      - uses: rust-lang/crates-io-auth-action@v1
      # Dependency order: every crate must exist on the registry before its
      # dependents publish.
      - run: cargo publish -p tablo-macros
      - run: cargo publish -p tablo-ui
      - run: cargo publish -p tablo-core
      - run: cargo publish -p tablo-test
      - run: cargo publish -p tablo-build
      - run: cargo publish -p tablo
