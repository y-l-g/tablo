name: bench

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - benchmarks/**
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - xtask/**
      - .github/workflows/bench.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0

jobs:
  bench-check:
    name: bench-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Detached workspace: own target dir and lockfile.
          workspaces: benchmarks/tablo
      # Lint the detached bench by manifest path; clippy is the compile check too.
      - name: Clippy detached bench workspace (locked)
        run: cargo clippy --locked --manifest-path benchmarks/tablo/Cargo.toml --all-targets -- -D warnings
