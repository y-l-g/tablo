name: bench

# The detached bench harness is not a per-PR gate: it rotted once, and neither
# `cargo test --workspace` nor `clippy --workspace` sees it, so it still needs a
# compile check — but only when it or the pins it measures can have moved.
# It runs here instead of in `ci.yml`, so a PR that touches neither (docs, UI,
# tests) does not pay for a harness build: on `master`, weekly, and on the PRs
# that touch the harness, a manifest, a lockfile, the toolchain pin, or the
# lockstep check itself.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      # Globs, not a list: over-triggering costs one build, under-triggering
      # costs a missed gate, so a manifest added later is covered on arrival.
      # The root files stand beside the globs: whether `**/` matches zero
      # directories is not a bet worth taking on a gate.
      - benchmarks/**
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - xtask/**
      - .github/workflows/bench.yml
  schedule:
    # Weekly: the harness re-resolves against the pinned toolchain even when
    # nothing lands, so a yanked dependency or a moved runner image surfaces
    # here instead of at the next unrelated PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# `target/debug/incremental` measured 28 of 66 GB locally: it busts the
# shared action-cache budget, so CI disables incremental compilation and
# trades a slower cold link for cache hits.
  CARGO_INCREMENTAL: 0

jobs:
  bench-check:
    name: bench-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The bench workspace is detached (see workspace `exclude`), so it
          # has its own target dir and lockfile.
          workspaces: benchmarks/tablo
      # Compile and lint the harness locked: neither `cargo test --workspace`
      # nor `clippy --workspace` sees the detached bench, so lint it by
      # manifest path. Clippy compiles every target, so it is the compile
      # check too.
      - name: Clippy detached bench workspace (locked)
        run: cargo clippy --locked --manifest-path benchmarks/tablo/Cargo.toml --all-targets -- -D warnings
      # Pin policy (Cargo.toml comment / ADR-0003): the bench must measure the
      # same upstream revs the workspace ships, so the two lockfiles stay in
      # lockstep through every bump. `verify-locks` fails on drift.
      - name: Lockstep pin check (workspace vs bench)
        run: cargo xtask verify-locks
