name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual re-publish of master, for when the release job failed after the
  # release PR merged. release-plz is idempotent, so this is safe to repeat.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0
# Warning denial lives in [workspace.lints.rust], not RUSTFLAGS: RUSTFLAGS partitions the build
# cache through every unit's fingerprint.

# Topcoat and Toasty track crates.io releases; Renovate groups their bumps.

jobs:
  # Branch prefix and label match release-plz.toml. The merge must be the
  # exact push commit checked by CI, and the PR must come from this repository.
  release-pr-merge:
    name: release PR merge
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'y-l-g/tablo'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check merged release PR
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('release', 'true');
              core.info('Manual dispatch; publishing master.');
              return;
            }
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo,
              commit_sha: context.sha,
              per_page: 100,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const release = prs.some(pr =>
              pr.state === 'closed'
              && pr.merged_at != null
              && pr.merge_commit_sha === context.sha
              && pr.base.ref === 'master'
              && pr.base.repo.full_name === repository
              && pr.head.repo?.full_name === repository
              && pr.head.ref.startsWith('release-plz-')
              && pr.labels.some(label => label.name === 'release')
            );
            core.setOutput('release', String(release));
            core.info(release ? 'Release PR merge confirmed.' : 'No release PR merge; skipping publishing.');

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # The suites are named rather than globbed: a glob would silently shrink the run when a
  # suite is renamed, while a missing path fails the job.
  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          node --test
          crates/tablo-ui/assets/selects.test.js
          crates/tablo-ui/assets/bulk.test.js
          crates/tablo-ui/assets/wire.test.js
          crates/tablo-ui/assets/dialog.test.js
          crates/tablo-ui/assets/mutation-submit.test.js
          crates/tablo-ui/assets/notifications.test.js
          crates/tablo-ui/assets/filters.test.js
          crates/tablo-ui/assets/live-search.test.js
          examples/showcase/assets/media.test.js

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` promotes every rustdoc lint to a failure.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2
      # Build the book here too: docs.yml only runs on master, so linkcheck catches a bad link
      # first.
      - run: mdbook build docs/guide

  # Its target dir is `target/external-check`, inside the cached `target`.
  external:
    name: external
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask external-check

# Gates 5 (msrv) and 7 (udeps) run in `msrv-udeps.yml`: each needs its own toolchain.

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Workspace fmt uses the pinned nightly: rustfmt.toml keys are nightly-only (GH #269).
      - run: rustup update stable && rustup default stable
      - run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Restore topcoat CLI cache
        id: cache-topcoat
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-0.10.0
      - name: Install topcoat CLI (for `topcoat fmt`)
        if: steps.cache-topcoat.outputs.cache-hit != 'true'
        run: cargo install topcoat-cli --version 0.10.0 --locked --force
      - name: topcoat fmt (pinned CLI, via xtask)
        # The toolchain and CLI installs stay in CI: xtask runs the check half only.
        # Covers detached fmt (examples/quickstart).
        run: cargo xtask fmt

  # Configure every released crate on crates.io to trust y-l-g/tablo,
  # workflow ci.yml, with no environment. All CI checks must pass before this
  # job can publish crates or create tags and GitHub Releases.
  release-plz-release:
    name: release
    runs-on: ubuntu-latest
    needs: [release-pr-merge, test, assets, clippy, docs, external, fmt]
    if: >-
      github.repository == 'y-l-g/tablo'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
      && needs.release-pr-merge.outputs.release == 'true'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      # release-plz obtains short-lived crates.io tokens through OIDC and
      # publishes the family in dependency order. It is idempotent: versions
      # already on crates.io and tags/releases that already exist are skipped.
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Maintains a draft release PR with pending version bumps and changelog
  # updates after successful master CI runs, including ordinary merges.
  release-plz-pr:
    name: release PR
    runs-on: ubuntu-latest
    needs: [test, assets, clippy, docs, external, fmt]
    if: >-
      github.repository == 'y-l-g/tablo'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # The guide's user-facing blocks pin released versions
      # (`tablo = { version = "X" }`, `tablo-build = "X"`). The source of truth is
      # `[workspace.package].version`, which release-plz bumps on the PR branch.
      # Re-applied on every run because release-plz force-pushes its branch.
      - name: Sync the guide's version pins
        if: ${{ steps.release-plz.outputs.prs != '' && steps.release-plz.outputs.prs != '[]' }}
        env:
          PRS: ${{ steps.release-plz.outputs.prs }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.[0].head_branch' <<<"$PRS")
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "No release branch detected; skipping consistency sync."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          git checkout "$branch"

          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' \
            Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "Failed to parse [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi

          # Only touch the `tablo` family pins, leaving the topcoat/toasty
          # pins (tracked by Renovate) alone.
          find docs/guide/src -type f -name '*.md' -exec sed -i -E \
            "s/(tablo = \{ version = \")[^\"]+(\")/\1${version}\2/g; s/^(tablo-build = \")[^\"]+(\")/\1${version}\2/g" {} +

          git add docs
          if git diff --cached --quiet; then
            echo "Release PR already consistent; nothing to update."
            exit 0
          fi

          git commit -m "chore: sync the guide's version pins for ${version}"
          git push origin "$branch"
