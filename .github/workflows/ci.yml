name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual re-publish of master, for when the release job failed after the
  # release PR merged. release-plz is idempotent, so this is safe to repeat.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The toolchain is the one rust-toolchain.toml pins; `rustup toolchain install` reads it.
# Warning denial lives in [workspace.lints.rust], not RUSTFLAGS: RUSTFLAGS partitions the build
# cache through every unit's fingerprint.
# A job that writes names what it writes; every other job reads the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0
  # The test builds exhaust the runner's memory: without debug info the test binaries link with
  # less, and fewer parallel rustc and linker processes lower the peak.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  # Branch prefix and label match release-plz.toml. The merge must be the
  # exact push commit checked by CI, and the PR must come from this repository.
  release-pr-merge:
    name: release PR merge
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'y-l-g/tablo'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check merged release PR
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('release', 'true');
              core.info('Manual dispatch; publishing master.');
              return;
            }
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo,
              commit_sha: context.sha,
              per_page: 100,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const release = prs.some(pr =>
              pr.state === 'closed'
              && pr.merged_at != null
              && pr.merge_commit_sha === context.sha
              && pr.base.ref === 'master'
              && pr.base.repo.full_name === repository
              && pr.head.repo?.full_name === repository
              && pr.head.ref.startsWith('release-plz-')
              && pr.labels.some(label => label.name === 'release')
            );
            core.setOutput('release', String(release));
            core.info(release ? 'Release PR merge confirmed.' : 'No release PR merge; skipping publishing.');

  # `cargo publish` ignores `[patch]`: a release would publish crates built against what crates.io
  # resolves, not what CI tested. While a manifest patches a dependency, a release PR fails here
  # and the release job does not run.
  unpatched:
    name: no dependency patch
    runs-on: ubuntu-latest
    needs: [release-pr-merge]
    if: >-
      !cancelled()
      && (startsWith(github.head_ref, 'release-plz-')
        || needs.release-pr-merge.outputs.release == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a release while a manifest patches a dependency
        run: |
          if grep -n '^\[patch' Cargo.toml examples/quickstart/Cargo.toml; then
            echo "::error::A manifest patches a crates.io dependency; drop the patch before releasing."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      # Ignored by default: trybuild checks Tablo again in a target directory of its own.
      - run: cargo test -p tablo-core --test compile_fail --locked -- --ignored

  # `test` runs the showcase and integration suites on SQLite; these run them on the other drivers:
  # the servers, whose `LIKE`, collation and identifier rules differ, and Turso, a separate engine
  # behind SQLite's dialect.
  postgresql:
    name: test (postgresql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TABLO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tablo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p showcase --features postgresql --test it --locked
      # The bench's Postgres leg, off in the workspace build.
      - run: cargo check -p tablo-bench --features postgresql --locked

  # The integration build is the step that exhausts the runner's memory. Its own job keeps that
  # failure apart from the showcase result.
  postgresql-integration:
    name: test (postgresql integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TABLO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tablo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p tablo-integration --features postgresql --tests --locked

  mysql:
    name: test (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tablo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      TABLO_TEST_DATABASE_URL: mysql://root:mysql@localhost:3306/tablo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p showcase --features mysql --test it --locked

  # The integration build is the step that exhausts the runner's memory. Its own job keeps that
  # failure apart from the showcase result.
  mysql-integration:
    name: test (mysql integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tablo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      TABLO_TEST_DATABASE_URL: mysql://root:mysql@localhost:3306/tablo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p tablo-integration --features mysql --tests --locked

  turso:
    name: test (turso)
    runs-on: ubuntu-latest
    env:
      TABLO_TEST_DATABASE_URL: "turso::memory:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p showcase --features turso --test it --locked
      - run: cargo test -p tablo-integration --features turso --tests --locked

  # The suites are named rather than globbed: a glob would silently shrink the run when a
  # suite is renamed, while a missing path fails the job.
  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: >-
          node --test
          crates/tablo-ui/assets/choice_create.test.js
          crates/tablo-ui/assets/file_lists.test.js
          crates/tablo-ui/assets/forms.test.js
          crates/tablo-ui/assets/password.test.js
          crates/tablo-ui/assets/repeaters.test.js
          crates/tablo-ui/assets/rich_text.test.js
          crates/tablo-ui/assets/search_shortcut.test.js
          crates/tablo-ui/assets/selects.test.js
          crates/tablo-ui/assets/tabs.test.js
          crates/tablo-ui/assets/theme.test.js
          crates/tablo-ui/assets/wizard.test.js

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked
      # The build without the default features, tests included: an app may drop `rich-text`.
      - run: cargo clippy -p tablo-core -p tablo --no-default-features --all-targets --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `-D warnings` promotes every rustdoc lint to a failure.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2@0.13.0
      # Build the book here too: docs.yml only runs on master, so linkcheck catches a bad link
      # first.
      - run: mdbook build docs/guide

  # Its target dir is `target/external-check`, inside the cached `target`.
  external:
    name: external
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask external-check

  # udeps runs in `udeps.yml` on nightly. A pull request runs it when it touches a manifest;
  # master runs it here, before the release job.
  udeps:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/udeps.yml

  # deny runs in `deny.yml`. A pull request runs it when it touches a manifest, and a schedule
  # catches a new advisory; master runs it here, before the release job.
  deny:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deny.yml

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Workspace fmt uses the pinned nightly: rustfmt.toml keys are nightly-only.
      - run: rustup toolchain install
      - run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Restore topcoat CLI cache
        id: cache-topcoat
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-0.12.1
      - name: Install topcoat CLI (for `topcoat fmt`)
        if: steps.cache-topcoat.outputs.cache-hit != 'true'
        run: cargo install topcoat-cli --version 0.12.1 --locked --force
      - name: topcoat fmt (pinned CLI, via xtask)
        # The toolchain and CLI installs stay in CI: xtask runs the check half only.
        # Covers detached fmt (examples/quickstart).
        run: cargo xtask fmt

  # Runs on a release PR and on the master push that merges one, like `unpatched`. The bump comes
  # from the commits, so this checks it: a version that does not cover the API changes since the
  # last release fails the release. Default features only, since the driver features are not part of
  # the default API.
  semver:
    name: semver
    runs-on: ubuntu-latest
    needs: [release-pr-merge]
    if: >-
      !cancelled()
      && (startsWith(github.head_ref, 'release-plz-')
        || needs.release-pr-merge.outputs.release == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - run: cargo semver-checks --workspace --default-features

  # Configure every released crate on crates.io to trust y-l-g/tablo,
  # workflow ci.yml, with no environment. All CI checks must pass before this
  # job can publish crates or create tags and GitHub Releases.
  release-plz-release:
    name: release
    runs-on: ubuntu-latest
    needs: [release-pr-merge, unpatched, semver, test, postgresql, postgresql-integration, mysql, mysql-integration, turso, assets, clippy, docs, external, fmt, udeps, deny]
    if: >-
      github.repository == 'y-l-g/tablo'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
      && needs.release-pr-merge.outputs.release == 'true'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      # release-plz obtains short-lived crates.io tokens through OIDC and
      # publishes the family in dependency order. It is idempotent: versions
      # already on crates.io and tags/releases that already exist are skipped.
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Maintains a draft release PR with pending version bumps and changelog
  # updates after successful master CI runs, including ordinary merges.
  release-plz-pr:
    name: release PR
    runs-on: ubuntu-latest
    needs: [test, postgresql, postgresql-integration, mysql, mysql-integration, turso, assets, clippy, docs, external, fmt]
    if: >-
      github.repository == 'y-l-g/tablo'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # The guide's user-facing blocks pin released versions
      # (`tablo = { version = "X" }`, `tablo-build = "X"`). The source of truth is
      # `[workspace.package].version`, which release-plz bumps on the PR branch.
      # Re-applied on every run because release-plz force-pushes its branch.
      - name: Sync the guide's version pins
        if: ${{ steps.release-plz.outputs.prs != '' && steps.release-plz.outputs.prs != '[]' }}
        env:
          PRS: ${{ steps.release-plz.outputs.prs }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.[0].head_branch' <<<"$PRS")
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "No release branch detected; skipping consistency sync."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          git checkout "$branch"

          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' \
            Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "Failed to parse [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi

          # Only touch the `tablo` family pins, leaving the topcoat/toasty
          # pins (tracked by Renovate) alone.
          find docs/guide/src -type f -name '*.md' -exec sed -i -E \
            "s/(tablo = \{ version = \")[^\"]+(\")/\1${version}\2/g; s/^(tablo-build = \")[^\"]+(\")/\1${version}\2/g" {} +

          git add docs
          if git diff --cached --quiet; then
            echo "Release PR already consistent; nothing to update."
            exit 0
          fi

          git commit -m "chore: sync the guide's version pins for ${version}"
          git push origin "$branch"
