name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0
# Warning denial lives in [workspace.lints.rust], not RUSTFLAGS: RUSTFLAGS partitions the build
# cache through every unit's fingerprint.

# Topcoat and Toasty are pinned to exact revs; bump via `cargo xtask bump-upstream` (GH #103).

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # The suites are named rather than globbed: a glob would silently shrink the run when a
  # suite is renamed, while a missing path fails the job.
  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          node --test
          crates/tablo-ui/assets/selects.test.js
          crates/tablo-ui/assets/bulk.test.js
          crates/tablo-ui/assets/wire.test.js
          crates/tablo-ui/assets/dialog.test.js
          crates/tablo-ui/assets/mutation-submit.test.js
          crates/tablo-ui/assets/notifications.test.js
          crates/tablo-ui/assets/filters.test.js
          crates/tablo-ui/assets/live-search.test.js
          examples/showcase/assets/media.test.js

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` promotes every rustdoc lint to a failure. Workspace only: the detached
      # benchmarks/* are separate workspaces.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Install mdBook and mdbook-linkcheck2
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-linkcheck2
      # Build the book here too: docs.yml only runs on master, so linkcheck catches a bad link
      # first.
      - run: mdbook build docs/guide

  # Its target dir is `target/external-check`, inside the cached `target`.
  external:
    name: external
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask external-check

# Gates 6 (msrv) and 8 (udeps) run in `msrv-udeps.yml`: each needs its own toolchain.

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Workspace fmt uses the pinned nightly: rustfmt.toml keys are nightly-only (GH #269).
      - run: rustup update stable && rustup default stable
      - run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Restore topcoat CLI cache
        # The cache restores the Cargo.lock-pinned rev.
        id: cache-topcoat
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-${{ hashFiles('Cargo.lock') }}
      - name: Install topcoat CLI (for `topcoat fmt`)
        if: steps.cache-topcoat.outputs.cache-hit != 'true'
        # Install the formatter at the Cargo.lock-pinned rev, read from the lock (GH #103).
        run: |
          REV=$(grep -A 2 '^name = "topcoat"$' Cargo.lock | grep -o '#[0-9a-f]\{40\}' | head -1 | cut -c2-)
          test -n "$REV" || { echo "could not read topcoat rev from Cargo.lock"; exit 1; }
          echo "Installing topcoat-cli at locked revision $REV"
          cargo install --git https://github.com/tokio-rs/topcoat --rev "$REV" topcoat-cli --locked --force
      - name: topcoat fmt (locked rev, via xtask)
        # The toolchain and CLI installs stay in CI: xtask runs the check half only.
        # Covers detached fmt (benchmarks/tablo, benchmarks/axum-maud, benchmarks/leptos,
        # examples/quickstart).
        run: cargo xtask fmt
