name: msrv-udeps

# Each needs its own toolchain, so these gates run apart from the per-PR jobs.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - .github/workflows/msrv-udeps.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: msrv-udeps-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
# Incremental compilation busts the shared action-cache budget, so CI disables it.
  CARGO_INCREMENTAL: 0

jobs:
  msrv:
    name: msrv (1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the floor: an upstream release can silently raise what it needs (GH #175).
      - run: rustup toolchain install 1.98 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.98 check --workspace --locked

  udeps:
    name: udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update nightly && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --locked
