name: Upstream gap
description: A Toasty or Topcoat API Tablo needs is missing or unstable. Track the gap here until it exists upstream.
title: "[upstream] "
labels: ["upstream"]
body:
  - type: markdown
    attributes:
      value: |
        One gap per issue, titled `<project>: <capability>`. The body is the status: edit it
        when the upstream state changes instead of commenting.

  - type: textarea
    id: upstream
    attributes:
      label: Upstream
      description: The project, the version `Cargo.lock` pins, and the upstream issue or PR with its state.
      placeholder: |
        Toasty 0.11.0 — toasty#1188, open.
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: Need
      description: The missing capability in one or two sentences, phrased as an API need.
      placeholder: |
        A predicate that classifies a unique-constraint violation, so a duplicate
        insert is reported inline instead of as an unclassified driver error.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: Today in Tablo
      description: The workaround, copied from the source, with its `file:line`.
      placeholder: |
        ```rust
        // crates/tablo-core/src/panel/forms.rs:523
        async fn check_unique<R: Resource>(
            cx: &Cx,
            schema: &crate::schema::Schema,
            values: &HashMap<String, String>,
            current: &HashMap<String, String>,
            ex: &mut dyn toasty::Executor,
        ) -> Result<HashMap<String, Vec<String>>, topcoat::Error> {
        ```
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed upstream API
      description: The smallest upstream signature that deletes the workaround.
      placeholder: |
        ```rust
        impl toasty::Error {
            fn is_unique_violation(&self) -> bool;
        }
        ```
    validations:
      required: true

  - type: input
    id: retire
    attributes:
      label: Retire when
      description: The Tablo code that gets deleted.
      placeholder: "`panel/forms.rs:523 check_unique` and its call sites at `panel/forms.rs:642` and `:790` are deleted."
    validations:
      required: true
