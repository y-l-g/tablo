[workspace]
resolver = "2"
members = [
    "crates/tablo",
    "crates/tablo-build",
    "crates/tablo-core",
    "crates/tablo-macros",
    "crates/tablo-test",
    "crates/tablo-ui",
    "examples/showcase",
    "xtask",
]
exclude = [
    "benchmarks/tablo",
    "benchmarks/axum-maud",
    "benchmarks/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
# Deny warnings through cargo's lint channel rather than a global
# `RUSTFLAGS=-Dwarnings`. RUSTFLAGS is hashed into every unit's fingerprint, so
# toggling it (CI vs. local, or a one-off `RUSTFLAGS=-Dwarnings cargo clippy`)
# invalidates the whole dependency graph; the lint table applies the same policy
# as part of the profile, without partitioning the build cache. Members opt in
# with `[lints] workspace = true`. This covers workspace members only, which is
# the intent — denying warnings in dependencies is upstream's business.
warnings = "deny"

[workspace.lints.clippy]
# Denied with the budget in the workspace-root `clippy.toml`
# (`too-many-lines-threshold = 300`; the lints table cannot express it).
# A function over budget needs a phase-split issue, not a wider budget.
too_many_lines = "deny"

# Pins are exact revs; bump via `cargo xtask bump-upstream` (GH #103) and sync
# `benchmarks/tablo/Cargo.lock` in the same commit.
#
# Libraries use `Db`/`Executor` only; apps and tests name their driver.
[workspace.dependencies]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "f7eb477242da9690458d183efa2e0aaa1b21b9da", default-features = false, features = ["view", "router", "discover"] }
toasty = { git = "https://github.com/tokio-rs/toasty", rev = "f9272526a36aeb9bdbe9df57e0613a84e8ab9790", default-features = false, features = ["jiff"] }
toasty-core = { git = "https://github.com/tokio-rs/toasty", rev = "f9272526a36aeb9bdbe9df57e0613a84e8ab9790" }
topcoat-ui = { git = "https://github.com/tokio-rs/topcoat", rev = "f7eb477242da9690458d183efa2e0aaa1b21b9da" }
topcoat-ui-registry = { git = "https://github.com/tokio-rs/topcoat", rev = "f7eb477242da9690458d183efa2e0aaa1b21b9da" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
