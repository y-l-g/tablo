[workspace]
resolver = "2"
members = [
    "crates/tablo",
    "crates/tablo-build",
    "crates/tablo-core",
    "crates/tablo-macros",
    "crates/tablo-test",
    "crates/tablo-ui",
    "examples/guide",
    "examples/showcase",
    "xtask",
]
exclude = [
    "benchmarks/tablo",
    "benchmarks/axum-maud",
    "benchmarks/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
# Deny via the lint table, not RUSTFLAGS: RUSTFLAGS partitions the build cache.
warnings = "deny"

[workspace.lints.clippy]
# The budget lives in the workspace-root `clippy.toml`; the lints table cannot express it.
too_many_lines = "deny"

# `topcoat`/`toasty` track crates.io releases; Renovate groups their bumps.
[workspace.dependencies]
topcoat = { version = "0.10", default-features = false, features = ["view", "router", "discover"] }
toasty = { version = "0.11", default-features = false, features = ["jiff"] }
toasty-core = { version = "0.11" }
topcoat-ui = { version = "0.10" }
topcoat-ui-registry = { version = "0.10" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
