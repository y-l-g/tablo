[workspace]
resolver = "2"
members = [
    "crates/tablo",
    "crates/tablo-build",
    "crates/tablo-core",
    "crates/tablo-macros",
    "crates/tablo-test",
    "crates/tablo-ui",
    "examples/showcase",
    "xtask",
]
exclude = [
    "benchmarks/tablo",
    "benchmarks/axum-maud",
    "benchmarks/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
# Deny via the lint table, not RUSTFLAGS: RUSTFLAGS partitions the build cache.
warnings = "deny"

[workspace.lints.clippy]
# The budget lives in the workspace-root `clippy.toml`; the lints table cannot express it.
too_many_lines = "deny"

# Exact revs; bump via `cargo xtask bump-upstream` (GH #103) with bench lock sync.
[workspace.dependencies]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "3e7bb43948a61dadcdba5a79d99c0f3a75de1abc", default-features = false, features = ["view", "router", "discover"] }
toasty = { git = "https://github.com/tokio-rs/toasty", rev = "f9272526a36aeb9bdbe9df57e0613a84e8ab9790", default-features = false, features = ["jiff"] }
toasty-core = { git = "https://github.com/tokio-rs/toasty", rev = "f9272526a36aeb9bdbe9df57e0613a84e8ab9790" }
topcoat-ui = { git = "https://github.com/tokio-rs/topcoat", rev = "3e7bb43948a61dadcdba5a79d99c0f3a75de1abc" }
topcoat-ui-registry = { git = "https://github.com/tokio-rs/topcoat", rev = "3e7bb43948a61dadcdba5a79d99c0f3a75de1abc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
