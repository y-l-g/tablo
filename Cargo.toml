[workspace]
resolver = "2"
members = [
    "benchmarks/tablo",
    "crates/tablo",
    "crates/tablo-build",
    "crates/tablo-core",
    "crates/tablo-macros",
    "crates/tablo-test",
    "crates/tablo-ui",
    "examples/guide",
    "examples/showcase",
    "integration",
    "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/y-l-g/tablo"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"
# Deny via the lint table, not RUSTFLAGS: RUSTFLAGS partitions the build cache.
warnings = "deny"

[workspace.lints.clippy]
# The budget lives in the workspace-root `clippy.toml`; the lints table cannot express it.
too_many_lines = "deny"

# `topcoat`/`toasty` track crates.io releases; Renovate groups their bumps.
[workspace.dependencies]
topcoat = { version = "0.11", default-features = false, features = ["view", "router", "discover"] }
toasty = { version = "0.11", default-features = false, features = ["jiff"] }
toasty-core = { version = "0.11" }
topcoat-l10n = { version = "0.11" }
topcoat-ui = { version = "0.11" }
topcoat-ui-registry = { version = "0.11" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23"
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# The decimal types a typed field binds and a money column spells, behind the `tablo-core`
# features named as Toasty's.
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
bigdecimal = { version = "0.4.10", default-features = false, features = ["std"] }

# Temporary: Topcoat `main` ahead of its next release. Tablo does not release while this
# patch stands; drop it and bump `topcoat` once that release is out.
[patch.crates-io]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-asset = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-cookie = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-core = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-font = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-icon = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-l10n = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-mail = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-router = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
