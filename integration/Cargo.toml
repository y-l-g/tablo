[package]
name = "tablo-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Tablo's integration suite: panels built from test-local models, served over HTTP."

# One test binary: autodiscovery would link every file under `tests/` separately.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

# The other drivers the suite runs on: `TABLO_TEST_DATABASE_URL` names the database.
[features]
postgresql = ["tablo/postgresql"]
mysql = ["tablo/mysql"]
turso = ["tablo/turso"]

[dev-dependencies]
form_urlencoded = "1.2"
http = "1"
http-body-util = "0.1"
jiff.workspace = true
tablo = { path = "../crates/tablo", features = ["testing"] }
toasty = { workspace = true, features = ["sqlite"] }
tokio.workspace = true
topcoat = { workspace = true, features = ["mail"] }
uuid.workspace = true

[lints]
workspace = true
