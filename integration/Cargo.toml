[package]
name = "tablo-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Tablo's integration suite: panels built from test-local models, served over HTTP."

# Five test binaries, one per area: one binary compiles on one core for minutes, and
# autodiscovery would link every file under `tests/` separately.
autotests = false

[[test]]
name = "accounts"
path = "tests/suite_accounts.rs"

[[test]]
name = "fields"
path = "tests/suite_fields.rs"

[[test]]
name = "records"
path = "tests/suite_records.rs"

[[test]]
name = "tables"
path = "tests/suite_tables.rs"

[[test]]
name = "panel"
path = "tests/suite_panel.rs"

# The other drivers the suite runs on: `TABLO_TEST_DATABASE_URL` names the database.
[features]
postgresql = ["tablo/postgresql"]
mysql = ["tablo/mysql"]
turso = ["tablo/turso"]

[dev-dependencies]
form_urlencoded = "1.2"
# The socket the live-bell suite opens to the served router.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
http-body-util = "0.1"
jiff.workspace = true
# The decimal features are on here so that the workspace build, and so CI, compiles them.
bigdecimal.workspace = true
rust_decimal.workspace = true
tablo = { path = "../crates/tablo", features = ["testing", "rust_decimal", "bigdecimal"] }
serde_json = "1"
toasty = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
topcoat = { workspace = true, features = ["mail", "serve", "l10n"] }
uuid.workspace = true

[lints]
workspace = true
