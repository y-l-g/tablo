[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde_json = "1"
# The lockfile hash the vendored TipTap bundle names.
sha2 = "0.11"
topcoat-ui = { workspace = true }
topcoat-ui-registry = { workspace = true }

# Anchor for `cargo metadata`: the registry is never named in code.
[package.metadata.cargo-udeps.ignore]
normal = ["topcoat-ui-registry"]
